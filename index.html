<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tools</title>
<meta name="description" content="自分が持っているツールとプロンプトをまとめておく、自分専用の保管庫。">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#189BBC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="tools">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
:root{
  --blue:#189BBC; --blue-deep:#127A95; --pale:#CCE2F0; --mist:#F0F6FA;
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#1A1A1A; --sub:#5B6B75; --line:#DCE6EC;
  --danger:#C24E4E; --shadow:0 2px 10px rgba(24,155,188,.10);
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1A20; --card:#16242C; --ink:#EEF4F7; --sub:#9FB2BC; --line:#25363F;
  --mist:#13222A; --pale:#1E4B5C; --shadow:0 2px 10px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0F1A20; --card:#16242C; --ink:#EEF4F7; --sub:#9FB2BC; --line:#25363F;
  --mist:#13222A; --pale:#1E4B5C; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.6}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}

.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 0 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .gear{margin-left:auto;align-self:center;width:36px;height:36px;border-radius:999px;background:var(--mist);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.brand .gear svg{width:18px;height:18px}
.toolbar{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.toolbar .spacer{flex:1}
.sortbtn{font-size:13px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card)}
.sortbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.mv{display:flex;gap:6px}
.mv button{width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--mist);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.mv button:disabled{opacity:.3}
.mv svg{width:16px;height:16px}
.tool .mv{position:absolute;left:6px;top:6px;z-index:3}
.chip .mvin{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.chip .mvin span{display:inline-flex;width:20px;height:20px;border-radius:999px;background:rgba(0,0,0,.12);align-items:center;justify-content:center;font-size:12px}
.chip[aria-pressed="true"] .mvin span{background:rgba(255,255,255,.3)}
.seg{display:flex;background:var(--mist);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 0;border-radius:999px;font-weight:700;color:var(--sub);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:34px;height:34px;border-radius:999px;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{border-color:var(--bg);box-shadow:0 0 0 2px var(--ink)}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(#f66,#fc6,#6f6,#6cf,#66f,#f6c,#f66)}
.sw.custom input{position:absolute;inset:-10px;width:200%;height:200%;opacity:0;cursor:pointer}
.brand h1{font-family:"Jost",sans-serif;font-weight:600;font-size:30px;letter-spacing:.02em;margin:0;color:var(--blue)}
.brand small{color:var(--sub);font-size:12px}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--mist);border:1px solid var(--line);border-radius:999px;padding:9px 14px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.search svg{width:16px;height:16px;color:var(--sub);flex:none}

.tabs{display:flex;gap:6px;margin:14px 0 10px;background:var(--mist);padding:4px;border-radius:999px}
.tabs button{flex:1;padding:9px 0;border-radius:999px;font-weight:700;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}

.empty{text-align:center;color:var(--sub);padding:48px 12px;border:1.5px dashed var(--line);border-radius:var(--r);margin-top:8px}
.empty b{display:block;color:var(--ink);margin-bottom:6px}

/* tools */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.tool .thumb{aspect-ratio:16/9;background:var(--mist);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tool .thumb img.full{width:100%;height:100%;object-fit:cover}
.tool .thumb img.ico{width:36px;height:36px;border-radius:8px}
.tool .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.tool .t{font-weight:700;font-size:14px;line-height:1.35;word-break:break-word}
.tool .d{color:var(--sub);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .m{color:var(--sub);font-size:12px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tool .open{position:absolute;inset:0}
.more{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:2}
.more svg{width:16px;height:16px}

/* prompts */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;color:var(--sub);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.add{border-style:dashed;color:var(--blue)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.pr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:grid;grid-template-columns:auto 1fr;gap:12px;position:relative}
.pr .thumb{width:64px;height:64px;border-radius:10px;background:var(--mist);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.pr .thumb img{width:100%;height:100%;object-fit:cover}
.pr .thumb svg{width:26px;height:26px}
.pr .head{min-width:0;padding-right:28px}
.pr .t{font-weight:700;font-size:15px;line-height:1.35}
.pr .tag{display:inline-block;font-size:11px;color:var(--blue);background:var(--pale);border-radius:6px;padding:1px 7px;margin-bottom:4px}
.pr .desc{color:var(--sub);font-size:13px;margin-top:2px}
.pr .actions{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.copy{flex:1;background:var(--blue);color:#fff;font-weight:700;border-radius:999px;padding:10px 0;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.copy:active{transform:scale(.97)}
.copy.done{background:#2E9E6B}
.copy svg{width:16px;height:16px}
.peek{padding:10px 14px;border-radius:999px;border:1px solid var(--line);color:var(--sub);font-size:13px}
a.copy{text-decoration:none}
.pr .ctext{grid-column:1/-1;margin:0;background:var(--mist);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
.pr .lnk{color:var(--sub);font-size:12px;margin-top:2px;word-break:break-all}
.pr pre{grid-column:1/-1;margin:0;background:var(--mist);border-radius:10px;padding:12px;font:13px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:var(--ink)}

/* fab */
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:999px;background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(24,155,188,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.fab svg{width:26px;height:26px}

/* bottom sheet */
.veil{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{margin:4px 0 12px;font-size:17px}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12px;font-weight:700;color:var(--sub)}
.f input[type=text],.f input[type=url],.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);outline:none}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--blue)}
.f textarea{min-height:120px;resize:vertical}
.f textarea.body{min-height:180px;font:13px/1.6 ui-monospace,Menlo,monospace}
.imgpick{display:flex;align-items:center;gap:10px}
.imgpick .pv{width:56px;height:56px;border-radius:10px;background:var(--mist);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px}
.imgpick .pv img{width:100%;height:100%;object-fit:cover}
.btn{border-radius:999px;padding:10px 16px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.small{padding:7px 12px;font-size:13px}
.qr{display:flex;justify-content:center;margin:6px 0 12px}.qr>div,.qr img{background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line)}.qr img{display:block}
.linkbox{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:64px;overflow:hidden;word-break:break-all}
.row{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.row .spacer{flex:1}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{text-align:left;padding:13px 6px;border-bottom:1px solid var(--line);font-weight:500}
.menu button:last-child{border-bottom:0}
.menu button.danger{color:var(--danger)}

/* footer / settings */
.foot{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;color:var(--sub);font-size:12.5px}
.foot .links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.note{background:var(--mist);border-radius:10px;padding:10px 12px;margin-top:8px}
.note b{color:var(--ink)}
.banner{background:var(--pale);border-radius:var(--r);padding:12px 14px;margin-top:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner b{display:block;margin-bottom:2px;color:var(--blue-deep)}
:root[data-theme="dark"] .banner b{color:#BFE6F2}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .banner b{color:#BFE6F2} }
.banner button{color:var(--sub);flex:none;font-size:18px;line-height:1}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .15s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>tools</h1><small>ツール・プロンプト・コンテンツ</small><button class="gear" id="gear" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="さがす" autocomplete="off">
    </div>
    <div class="banner" id="banner" hidden>
      <div><b>ホーム画面に追加すると、アプリみたいに開けるよ</b>iPhoneは共有ボタン →「ホーム画面に追加」。Androidはブラウザのメニュー →「ホーム画面に追加」。</div>
      <button id="bannerClose" aria-label="閉じる">×</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="tools" aria-selected="true">ツール</button>
    <button role="tab" data-tab="prompts" aria-selected="false">プロンプト</button>
    <button role="tab" data-tab="contents" aria-selected="false">コンテンツ</button>
  </div>

  <div class="toolbar"><span class="spacer"></span><button class="sortbtn" id="sortBtn" aria-pressed="false">並べ替え</button></div>
  <section id="tabTools"></section>
  <section id="tabPrompts" hidden>
    <div class="chips" id="chips"></div>
    <div class="list" id="plist"></div>
  </section>
  <section id="tabContents" hidden>
    <div class="chips" id="cchips"></div>
    <div class="list" id="clist"></div>
  </section>

  <footer class="foot">
    <div>データはこの端末のブラウザの中だけに保存される。サイトが更新されても消えない。スマホやPCにも同じものを出したいときは「引き継ぎリンク」で持っていってね。</div>
    <div class="links">
      <button class="btn small primary" id="linkBtn">引き継ぎリンク（QR）</button>
      <button class="btn small" id="exportBtn">バックアップを書き出す</button>
      <button class="btn small" id="importBtn">読み込む</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div class="note"><b>消えるとき</b>：ブラウザのデータを消したとき。iPhoneのSafariで長い間開かなかったとき（ホーム画面に追加してあれば大丈夫）。</div>
  </footer>
</div>

<button class="fab" id="fab" aria-label="追加"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toast" id="toast"></div>

<script>
const KEY='shio_tools_v1';
// 最初から入れるものは無し（2026-09-22 しおちゃんの指示で、分析プロンプトのカードを外した）
const SEED_TOOLS=[];
const SEED_URL='https://shiochann.github.io/shio-tools/tools/sns-account-analysis/';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const $=s=>document.querySelector(s);

let S=load();
function load(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ d=null; }
  if(!d){ d={v:1,seeded:true,tools:SEED_TOOLS.map(t=>({...t})),boxes:[],prompts:[],banner:true}; save(d); }
  // 将来 形を変えるときは、ここで d.v を見て読み替える（データは消さない）
  if(!d.boxes) d.boxes=[]; if(!d.prompts) d.prompts=[]; if(!d.tools) d.tools=[]; if(!d.contents) d.contents=[]; if(!d.cboxes) d.cboxes=[];
  // 以前は分析プロンプトのカードが最初から入っていた。手を加えていないものだけ外す（名前やURLを変えていたら残す）
  const seed=d.tools.find(t=>t.id==='seed-sns-analysis');
  if(seed && seed.url===SEED_URL && seed.title==='SNSアカウント分析プロンプト'){ d.tools=d.tools.filter(t=>t!==seed); save(d); }
  return d;
}
function save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d||S)); }catch(e){ toast('保存できなかった、、、容量がいっぱいかも'); } }

let tab='tools', box='all', cbox='all', q='', sorting=false;
const PRESETS=['#189BBC','#E86A8A','#F2A33A','#3FA66B','#6C5CE7','#2D3A45','#C2185B','#00897B'];
S.prefs=S.prefs||{theme:'auto',accent:'#189BBC'};
function hex2rgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); }
const mix=(h,to,k)=>'#'+hex2rgb(h).map((c,i)=>Math.round(c+(to[i]-c)*k).toString(16).padStart(2,'0')).join('');
function applyPrefs(){
  const r=document.documentElement, t=S.prefs.theme;
  if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t);
  const dark = t==='dark' || (t==='auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const a=S.prefs.accent||'#189BBC';
  r.style.setProperty('--blue',a);
  r.style.setProperty('--blue-deep',mix(a,[0,0,0],.25));
  const W=[255,255,255], K=[12,15,18];
  r.style.setProperty('--pale',dark?mix(a,K,.62):mix(a,W,.78));
  // 薄い背景（検索・タブ・サムネ枠）と線の色も、選んだ色に合わせて薄くする
  r.style.setProperty('--mist',dark?mix(a,K,.83):mix(a,W,.90));
  r.style.setProperty('--line',dark?mix(a,K,.78):mix(a,W,.82));
  // ページ全体の背景も選んだ色寄りに（ライトはごく薄く。カードは白のまま浮かせる）
  r.style.setProperty('--bg',dark?mix(a,K,.93):mix(a,W,.955));
  if(dark) r.style.setProperty('--card',mix(a,K,.88)); else r.style.removeProperty('--card');
  r.style.setProperty('--shadow',`0 2px 10px ${dark?'rgba(0,0,0,.35)':mix(a,W,0)+'1A'}`);
  document.querySelector('meta[name=theme-color]').content=a;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyPrefs);
applyPrefs();
const ARR_UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
const ARR_DN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
function move(arr,id,dir){ const i=arr.findIndex(x=>x.id===id), j=i+dir; if(i<0||j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; save(); render(); }
const domainOf=u=>{ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } };
const favicon=u=>{ const d=domainOf(u); return d?`https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=64`:''; };
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hit=(...f)=>!q||f.join(' ').toLowerCase().includes(q.toLowerCase());

/* ---------- render ---------- */
function render(){
  $('#tabTools').hidden = tab!=='tools';
  $('#tabPrompts').hidden = tab!=='prompts';
  $('#tabContents').hidden = tab!=='contents';
  document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('#banner').hidden = !S.banner;
  $('#sortBtn').setAttribute('aria-pressed',sorting); $('#sortBtn').textContent=sorting?'並べ替え中（完了）':'並べ替え';
  $('#fab').hidden=sorting;
  tab==='tools'?renderTools():tab==='prompts'?renderPrompts():renderContents();
}
function renderTools(){
  const list=S.tools.filter(t=>hit(t.title,t.url,t.memo));
  const el=$('#tabTools');
  if(!list.length){ el.innerHTML=`<div class="empty"><b>${q?'見つからなかった':'まだ何もない'}</b>${q?'':'右下の＋から、持ってるツールのURLを貼ってね'}</div>`; return; }
  const ids=S.tools.map(t=>t.id);
  el.innerHTML=`<div class="grid">`+list.map(t=>`
    <div class="tool">${sorting?`<div class="mv"><button data-mv-tool="${t.id}" data-dir="-1" ${ids.indexOf(t.id)===0?'disabled':''} aria-label="前へ">${ARR_UP}</button><button data-mv-tool="${t.id}" data-dir="1" ${ids.indexOf(t.id)===ids.length-1?'disabled':''} aria-label="後ろへ">${ARR_DN}</button></div>`:''}
      <div class="thumb">${t.img?`<img class="full" src="${t.img}" alt="">`:(favicon(t.url)?`<img class="ico" src="${favicon(t.url)}" alt="" loading="lazy" onerror="this.remove()">`:'')}</div>
      <div class="body"><div class="t">${esc(t.title)||esc(domainOf(t.url))}</div><div class="d">${esc(domainOf(t.url))}</div>${t.memo?`<div class="m">${esc(t.memo)}</div>`:''}</div>
      ${sorting?'':`<a class="open" href="${esc(t.url)}" target="_blank" rel="noopener" aria-label="${esc(t.title)}を開く"></a>`}
      ${sorting?'':`<button class="more" data-more-tool="${t.id}" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>`}
    </div>`).join('')+`</div>`;
}
function renderPrompts(){
  const chips=$('#chips');
  chips.innerHTML=`<button class="chip" data-box="all" aria-pressed="${box==='all'}">すべて</button>`+
    S.boxes.map((b,i)=>`<button class="chip" data-box="${b.id}" aria-pressed="${box===b.id}">${esc(b.name)}${sorting?`<span class="mvin"><span data-mv-box="${b.id}" data-dir="-1" ${i===0?'hidden':''}>‹</span><span data-mv-box="${b.id}" data-dir="1" ${i===S.boxes.length-1?'hidden':''}>›</span></span>`:''}</button>`).join('')+
    `<button class="chip add" data-box="__new">＋ 箱を作る</button>`;
  const list=S.prompts.filter(p=>(box==='all'||p.boxId===box)&&hit(p.title,p.desc,p.body));
  const el=$('#plist');
  if(!list.length){ el.innerHTML=`<div class="empty"><b>${q?'見つからなかった':'まだ何もない'}</b>${q?'':'右下の＋から、プロンプトを入れてね。箱を作って分けておくと探しやすい'}</div>`; return; }
  const bname=id=>(S.boxes.find(b=>b.id===id)||{}).name||'';
  el.innerHTML=list.map(p=>`
    <div class="pr" data-id="${p.id}">
      <div class="thumb">${p.img?`<img src="${p.img}" alt="">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>`}</div>
      <div class="head">${bname(p.boxId)?`<span class="tag">${esc(bname(p.boxId))}</span>`:''}<div class="t">${esc(p.title)}</div>${p.desc?`<div class="desc">${esc(p.desc)}</div>`:''}</div>
      <button class="more" data-more-prompt="${p.id}" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      <div class="actions">
        ${sorting?`<div class="mv"><button data-mv-prompt="${p.id}" data-dir="-1" aria-label="上へ">${ARR_UP}</button><button data-mv-prompt="${p.id}" data-dir="1" aria-label="下へ">${ARR_DN}</button></div><span style="flex:1"></span>`:''}
        <button class="copy" data-copy="${p.id}" ${sorting?'hidden':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>コピー</button>
        <button class="peek" data-peek="${p.id}" ${sorting?'hidden':''}>中身</button>
      </div>
      <pre hidden data-body="${p.id}">${esc(p.body)}</pre>
    </div>`).join('');
}

function renderContents(){
  const chips=$('#cchips');
  chips.innerHTML=`<button class="chip" data-cbox="all" aria-pressed="${cbox==='all'}">すべて</button>`+
    S.cboxes.map((b,i)=>`<button class="chip" data-cbox="${b.id}" aria-pressed="${cbox===b.id}">${esc(b.name)}${sorting?`<span class="mvin"><span data-mv-cbox="${b.id}" data-dir="-1" ${i===0?'hidden':''}>‹</span><span data-mv-cbox="${b.id}" data-dir="1" ${i===S.cboxes.length-1?'hidden':''}>›</span></span>`:''}</button>`).join('')+
    `<button class="chip add" data-cbox="__new">＋ ジャンルを作る</button>`;
  const list=S.contents.filter(c=>(cbox==='all'||c.boxId===cbox)&&hit(c.title,c.desc,c.body,c.url));
  const el=$('#clist');
  if(!list.length){ el.innerHTML=`<div class="empty"><b>${q?'見つからなかった':'まだ何もない'}</b>${q?'':'右下の＋から、無料配布や読み物を入れてね。ジャンルで分けておくと探しやすい'}</div>`; return; }
  const bname=id=>(S.cboxes.find(b=>b.id===id)||{}).name||'';
  const DOC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
  el.innerHTML=list.map(c=>`
    <div class="pr" data-id="${c.id}">
      <div class="thumb">${c.img?`<img src="${c.img}" alt="">`:(c.url&&favicon(c.url)?`<img src="${favicon(c.url)}" alt="" loading="lazy" style="width:28px;height:28px;object-fit:contain" onerror="this.remove()">`:DOC)}</div>
      <div class="head">${bname(c.boxId)?`<span class="tag">${esc(bname(c.boxId))}</span>`:''}<div class="t">${esc(c.title)}</div>${c.desc?`<div class="desc">${esc(c.desc)}</div>`:''}${c.url?`<div class="lnk">${esc(domainOf(c.url))}</div>`:''}</div>
      <button class="more" data-more-content="${c.id}" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      <div class="actions">
        ${sorting?`<div class="mv"><button data-mv-content="${c.id}" data-dir="-1" aria-label="上へ">${ARR_UP}</button><button data-mv-content="${c.id}" data-dir="1" aria-label="下へ">${ARR_DN}</button></div><span style="flex:1"></span>`:''}
        ${!sorting&&c.url?`<a class="copy" href="${esc(c.url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>開く</a>`:''}
        ${!sorting&&c.body?`<button class="${c.url?'peek':'copy'}" data-read="${c.id}">読む</button>`:''}
        ${!sorting&&c.body?`<button class="peek" data-ccopy="${c.id}">コピー</button>`:''}
      </div>
      ${c.body?`<div class="ctext" hidden data-cbody="${c.id}">${esc(c.body)}</div>`:''}
    </div>`).join('');
}

/* ---------- sheet ---------- */
function sheet(html){
  close();
  const v=document.createElement('div'); v.className='veil'; v.id='veil';
  v.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  v.addEventListener('click',e=>{ if(e.target===v) close(); });
  document.body.appendChild(v); document.body.style.overflow='hidden';
  return v;
}
function close(){ const v=$('#veil'); if(v){ v.remove(); document.body.style.overflow=''; } }

function imgField(cur){
  return `<div class="f"><label>サムネ（任意）</label><div class="imgpick"><div class="pv" id="pv">${cur?`<img src="${cur}">`:'なし'}</div>
    <input type="file" id="imgIn" accept="image/*" hidden><button type="button" class="btn small" id="imgBtn">写真を選ぶ</button><button type="button" class="btn small" id="imgClr">消す</button></div></div>`;
}
function bindImg(v,state){
  v.querySelector('#imgBtn').onclick=()=>v.querySelector('#imgIn').click();
  v.querySelector('#imgClr').onclick=()=>{ state.img=''; v.querySelector('#pv').textContent='なし'; };
  v.querySelector('#imgIn').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; state.img=await shrink(f); v.querySelector('#pv').innerHTML=`<img src="${state.img}">`; };
}
function shrink(file){ return new Promise(res=>{
  const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{
    const M=480, k=Math.min(1,M/Math.max(im.width,im.height)); const c=document.createElement('canvas');
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.82)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

function toolForm(t){
  const st={img:t?.img||''};
  const v=sheet(`<h2>${t?'ツールを直す':'ツールを追加'}</h2>
    <div class="f"><label>URL</label><input type="url" id="fUrl" placeholder="https://" value="${esc(t?.url||'')}" inputmode="url"></div>
    <div class="f"><label>名前</label><input type="text" id="fTitle" placeholder="空ならURLから付ける" value="${esc(t?.title||'')}"></div>
    <div class="f"><label>メモ（任意）</label><textarea id="fMemo" style="min-height:70px" placeholder="何に使うか、誰にもらったか、など">${esc(t?.memo||'')}</textarea></div>
    ${imgField(st.img)}
    <div class="row">${t?`<button class="btn danger" id="del">削除</button>`:''}<span class="spacer"></span><button class="btn" id="cancel">やめる</button><button class="btn primary" id="ok">保存</button></div>`);
  bindImg(v,st);
  v.querySelector('#cancel').onclick=close;
  if(t) v.querySelector('#del').onclick=()=>{ if(confirm('このツールを消す？')){ S.tools=S.tools.filter(x=>x.id!==t.id); save(); close(); render(); } };
  v.querySelector('#ok').onclick=()=>{
    let url=v.querySelector('#fUrl').value.trim(); if(url&&!/^https?:\/\//i.test(url)) url='https://'+url;
    if(!url||!domainOf(url)){ toast('URLを入れてね'); return; }
    const o={id:t?.id||uid(),url,title:v.querySelector('#fTitle').value.trim()||domainOf(url),memo:v.querySelector('#fMemo').value.trim(),img:st.img,created:t?.created||Date.now()};
    if(t) S.tools=S.tools.map(x=>x.id===t.id?o:x); else S.tools.unshift(o);
    save(); close(); render(); toast(t?'直した！！':'追加した！！');
  };
  setTimeout(()=>v.querySelector(t?'#fTitle':'#fUrl').focus(),50);
}
function promptForm(p){
  const st={img:p?.img||''};
  const opts=`<option value="">（箱なし）</option>`+S.boxes.map(b=>`<option value="${b.id}" ${p?.boxId===b.id||(!p&&box===b.id)?'selected':''}>${esc(b.name)}</option>`).join('');
  const v=sheet(`<h2>${p?'プロンプトを直す':'プロンプトを追加'}</h2>
    <div class="f"><label>タイトル</label><input type="text" id="fTitle" placeholder="例：投稿の1行目を10案出す" value="${esc(p?.title||'')}"></div>
    <div class="f"><label>箱</label><select id="fBox">${opts}</select></div>
    <div class="f"><label>説明（任意）</label><input type="text" id="fDesc" placeholder="どんなときに使うか、ひとこと" value="${esc(p?.desc||'')}"></div>
    ${imgField(st.img)}
    <div class="f"><label>プロンプト本文</label><textarea id="fBody" class="body" placeholder="ここに貼る">${esc(p?.body||'')}</textarea></div>
    <div class="row">${p?`<button class="btn danger" id="del">削除</button>`:''}<span class="spacer"></span><button class="btn" id="cancel">やめる</button><button class="btn primary" id="ok">保存</button></div>`);
  bindImg(v,st);
  v.querySelector('#cancel').onclick=close;
  if(p) v.querySelector('#del').onclick=()=>{ if(confirm('このプロンプトを消す？')){ S.prompts=S.prompts.filter(x=>x.id!==p.id); save(); close(); render(); } };
  v.querySelector('#ok').onclick=()=>{
    const title=v.querySelector('#fTitle').value.trim(), body=v.querySelector('#fBody').value;
    if(!title){ toast('タイトルを入れてね'); return; } if(!body.trim()){ toast('本文を入れてね'); return; }
    const o={id:p?.id||uid(),title,boxId:v.querySelector('#fBox').value,desc:v.querySelector('#fDesc').value.trim(),img:st.img,body,created:p?.created||Date.now()};
    if(p) S.prompts=S.prompts.map(x=>x.id===p.id?o:x); else S.prompts.unshift(o);
    save(); close(); render(); toast(p?'直した！！':'追加した！！');
  };
  setTimeout(()=>v.querySelector('#fTitle').focus(),50);
}
function contentForm(c){
  const st={img:c?.img||''};
  const opts=`<option value="">（ジャンルなし）</option>`+S.cboxes.map(b=>`<option value="${b.id}" ${c?.boxId===b.id||(!c&&cbox===b.id)?'selected':''}>${esc(b.name)}</option>`).join('');
  const v=sheet(`<h2>${c?'コンテンツを直す':'コンテンツを追加'}</h2>
    <div class="f"><label>タイトル</label><input type="text" id="fTitle" placeholder="例：Threads攻略PDF / 伸びた投稿の考え方" value="${esc(c?.title||'')}"></div>
    <div class="f"><label>ジャンル</label><select id="fBox">${opts}</select></div>
    <div class="f"><label>説明（任意）</label><input type="text" id="fDesc" placeholder="誰にもらったか、どんな内容か、ひとこと" value="${esc(c?.desc||'')}"></div>
    <div class="f"><label>URL（任意）</label><input type="url" id="fUrl" placeholder="配布ページやPDFのリンク" value="${esc(c?.url||'')}" inputmode="url"></div>
    ${imgField(st.img)}
    <div class="f"><label>本文（任意）</label><textarea id="fBody" placeholder="文章のコンテンツはここに貼る。URLだけなら空でOK">${esc(c?.body||'')}</textarea></div>
    <div class="row">${c?`<button class="btn danger" id="del">削除</button>`:''}<span class="spacer"></span><button class="btn" id="cancel">やめる</button><button class="btn primary" id="ok">保存</button></div>`);
  bindImg(v,st);
  v.querySelector('#cancel').onclick=close;
  if(c) v.querySelector('#del').onclick=()=>{ if(confirm('このコンテンツを消す？')){ S.contents=S.contents.filter(x=>x.id!==c.id); save(); close(); render(); } };
  v.querySelector('#ok').onclick=()=>{
    const title=v.querySelector('#fTitle').value.trim(), body=v.querySelector('#fBody').value;
    let url=v.querySelector('#fUrl').value.trim(); if(url&&!/^https?:\/\//i.test(url)) url='https://'+url;
    if(!title){ toast('タイトルを入れてね'); return; }
    if(url&&!domainOf(url)){ toast('URLの形がおかしいみたい'); return; }
    if(!url&&!body.trim()){ toast('URLか本文、どちらかは入れてね'); return; }
    const o={id:c?.id||uid(),title,boxId:v.querySelector('#fBox').value,desc:v.querySelector('#fDesc').value.trim(),url,img:st.img,body,created:c?.created||Date.now()};
    if(c) S.contents=S.contents.map(x=>x.id===c.id?o:x); else S.contents.unshift(o);
    save(); close(); render(); toast(c?'直した！！':'追加した！！');
  };
  setTimeout(()=>v.querySelector('#fTitle').focus(),50);
}
function boxForm(b,kind='p'){
  const C=kind==='c', list=C?S.cboxes:S.boxes, items=C?S.contents:S.prompts, word=C?'ジャンル':'箱', inner=C?'コンテンツ':'プロンプト';
  const v=sheet(`<h2>${b?`${word}の名前を変える`:`${word}を作る`}</h2>
    <div class="f"><label>${word}の名前</label><input type="text" id="fName" placeholder="${C?'例：無料配布 / 読み物 / セミナー資料':'例：Threads投稿 / 分析 / 記事'}" value="${esc(b?.name||'')}"></div>
    <div class="row">${b?`<button class="btn danger" id="del">${word}を消す</button>`:''}<span class="spacer"></span><button class="btn" id="cancel">やめる</button><button class="btn primary" id="ok">保存</button></div>
    ${b?`<div class="note" style="margin-top:14px">${word}を消しても、中の${inner}は消えない（「${word}なし」になる）</div>`:''}`);
  v.querySelector('#cancel').onclick=close;
  if(b) v.querySelector('#del').onclick=()=>{ if(confirm(`この${word}を消す？中の${inner}は残る`)){ const nl=list.filter(x=>x.id!==b.id); if(C) S.cboxes=nl; else S.boxes=nl; items.forEach(p=>{ if(p.boxId===b.id) p.boxId=''; }); if(C){ if(cbox===b.id) cbox='all'; } else if(box===b.id) box='all'; save(); close(); render(); } };
  v.querySelector('#ok').onclick=()=>{
    const name=v.querySelector('#fName').value.trim(); if(!name){ toast('名前を入れてね'); return; }
    if(b) b.name=name; else { const nb={id:uid(),name}; list.push(nb); if(C) cbox=nb.id; else box=nb.id; }
    save(); close(); render();
  };
  setTimeout(()=>v.querySelector('#fName').focus(),50);
}
function settingsSheet(){
  const th=S.prefs.theme, ac=S.prefs.accent;
  const isPreset=PRESETS.includes(ac.toUpperCase())||PRESETS.includes(ac);
  const v=sheet(`<h2>設定</h2>
    <div class="f"><label>見た目</label><div class="seg" id="segTheme">
      <button data-th="auto" aria-pressed="${th==='auto'}">端末に合わせる</button><button data-th="light" aria-pressed="${th==='light'}">ライト</button><button data-th="dark" aria-pressed="${th==='dark'}">ダーク</button></div></div>
    <div class="f"><label>色</label><div class="swatches" id="sw">
      ${PRESETS.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" aria-pressed="${c.toLowerCase()===ac.toLowerCase()}" aria-label="${c}"></button>`).join('')}
      <label class="sw custom" aria-pressed="${!isPreset}" title="好きな色"><input type="color" id="swCustom" value="${ac}"></label></div></div>
    <div class="f"><label>並べ替え</label><div style="color:var(--sub);font-size:13px">一覧の上の「並べ替え」を押すと、ツール・プロンプト・箱に矢印が出る。もう一度押すと完了。</div></div>

  const pick=c=>{ S.prefs.accent=c; save(); applyPrefs(); v.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',(x.dataset.c||'').toLowerCase()===c.toLowerCase())); v.querySelector('.sw.custom').setAttribute('aria-pressed',!PRESETS.some(p=>p.toLowerCase()===c.toLowerCase())); };
  v.querySelectorAll('.sw[data-c]').forEach(b=>b.onclick=()=>pick(b.dataset.c));

function menu(items){
  const v=sheet(`<div class="menu">${items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'danger':''}">${it.label}</button>`).join('')}<button data-i="-1">やめる</button></div>`);
  v.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; close(); if(i>=0) items[i].fn(); });
}

/* ---------- copy / toast ---------- */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok;
}
let tt; function toast(m){ const e=$('#toast'); e.textContent=m; e.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('show'),1500); }

/* ---------- backup ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const d=new Date(), z=n=>String(n).padStart(2,'0'); a.download=`tools-backup-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importJSON(file){
  const r=new FileReader(); r.onload=()=>{ try{
    const d=JSON.parse(r.result); if(!validData(d)) throw 0;
    applyImport(d, confirm('今あるものに「足す」ならOK、「置き換える」ならキャンセル'));
  }catch(e){ toast('このファイルは読めなかった、、、'); } }; r.readAsText(file);
}
function validData(d){ return !!d && Array.isArray(d.tools) && Array.isArray(d.prompts); }
function applyImport(d,add){
  if(add){ const have=new Set([...S.tools,...S.prompts,...S.boxes,...S.contents,...S.cboxes].map(x=>x.id));
    (d.boxes||[]).forEach(b=>{ if(!have.has(b.id)) S.boxes.push(b); }); d.tools.forEach(t=>{ if(!have.has(t.id)) S.tools.push(t); }); d.prompts.forEach(p=>{ if(!have.has(p.id)) S.prompts.push(p); });
    (d.cboxes||[]).forEach(b=>{ if(!have.has(b.id)) S.cboxes.push(b); }); (d.contents||[]).forEach(c=>{ if(!have.has(c.id)) S.contents.push(c); });
  } else { S={v:1,seeded:true,tools:d.tools,boxes:d.boxes||[],prompts:d.prompts,contents:d.contents||[],cboxes:d.cboxes||[],banner:false,prefs:S.prefs}; }
  save(); render(); toast('読み込んだ！！');
}

/* ---------- 引き継ぎリンク（URLの#にデータを入れる。サーバーには送られない） ---------- */
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function b64u(bytes){ let s=''; for(let i=0;i<bytes.length;i+=3){ const a=bytes[i],b=bytes[i+1],c=bytes[i+2],n=(a<<16)|((b||0)<<8)|(c||0); s+=B64[n>>18&63]+B64[n>>12&63]+(b===undefined?'':B64[n>>6&63])+(c===undefined?'':B64[n&63]); } return s; }
function unb64u(str){ const m={}; [...B64].forEach((c,i)=>m[c]=i); const out=[]; for(let i=0;i<str.length;i+=4){ const a=m[str[i]],b=m[str[i+1]],c=m[str[i+2]],d=m[str[i+3]]; const n=(a<<18)|(b<<12)|((c||0)<<6)|(d||0); out.push(n>>16&255); if(c!==undefined) out.push(n>>8&255); if(d!==undefined) out.push(n&255); } return new Uint8Array(out); }
async function pipeBytes(bytes,stream){ const r=new Blob([bytes]).stream().pipeThrough(stream); return new Uint8Array(await new Response(r).arrayBuffer()); }
// 自分で載せたサムネ（data:画像）はリンク用に小さくする（長辺160px）。URLのサムネはそのまま
function shrinkForLink(dataUrl){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ try{
  const M=160,k=Math.min(1,M/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.7)); }catch(e){ res(''); } }; im.onerror=()=>res(''); im.src=dataUrl; }); }
const hasOwnImg=()=>[...S.tools,...S.prompts,...S.contents].some(x=>(x.img||'').startsWith('data:'));
async function sharePayload(withImg){
  const conv=async x=>{ const img=x.img||''; if(!img.startsWith('data:')) return {...x}; return {...x,img:withImg?await shrinkForLink(img):''}; };
  return {v:1,tools:await Promise.all(S.tools.map(conv)),boxes:S.boxes,prompts:await Promise.all(S.prompts.map(conv)),cboxes:S.cboxes,contents:await Promise.all(S.contents.map(conv))};
}
async function encodeShare(withImg=true){
  const bytes=new TextEncoder().encode(JSON.stringify(await sharePayload(withImg)));
  if(window.CompressionStream){ try{ return 'h='+b64u(await pipeBytes(bytes,new CompressionStream('deflate-raw'))); }catch(e){} }
  return 'j='+b64u(bytes);
}
// 貼られた文章のどこにあっても、いちばん長い h=… / j=… を拾う（前後に文字が付いていても平気）
function extractHash(text){
  let best=null; for(const m of String(text||'').matchAll(/([hj])=([A-Za-z0-9\-_]{16,})/g)){ if(!best||m[2].length>best[2].length) best=m; }
  return best?`#${best[1]}=${best[2]}`:'';
}
async function decodeShare(hash){
  const m=/^#?([hj])=([A-Za-z0-9\-_]+)$/.exec(hash||''); if(!m) return null;
  let bytes=unb64u(m[2]);
  if(m[1]==='h'){ if(!window.DecompressionStream) throw new Error('old'); bytes=await pipeBytes(bytes,new DecompressionStream('deflate-raw')); }
  const d=JSON.parse(new TextDecoder().decode(bytes)); return validData(d)?d:null;
}
const QR_MAX=2800; // QRに入る上限（バイト）。超えたらリンクだけ出す
function loadQR(){ return new Promise((res,rej)=>{ if(window.QRCode) return res(); const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
const LINE_MAX=9000; // LINEのトークは1万字まで。余裕を見た目安
async function shareSheet(){
  const own=hasOwnImg();
  const v=sheet(`<h2>引き継ぎリンク</h2>
    <div class="f"><div style="color:var(--sub);font-size:13px">スマホのカメラでQRを読むか、リンクをコピーして自分に送る。開いた端末で「足す」か「置き換える」を選べば、今ここにあるツール・箱・プロンプトがそのまま出る。</div></div>
    ${own?`<label class="chk" style="display:flex;gap:8px;align-items:center;font-size:13px;margin:-4px 0 10px"><input type="checkbox" id="withImg" checked>自分で載せたサムネも入れる（リンクが長くなる）</label>`:''}
    <div class="qr" id="qr"><div style="color:var(--sub);font-size:13px;padding:20px">作ってる、、、</div></div>
    <div class="f"><label>リンク <span id="sz" style="font-weight:500"></span></label><div class="linkbox" id="lk" style="user-select:none;-webkit-user-select:none"></div></div>
    <div class="row"><button class="btn" id="cancel">閉じる</button><span class="spacer"></span><button class="btn" id="fileBtn">ファイルで送る</button><button class="btn primary" id="cp">リンクをコピー</button></div>
    <div class="note" id="shareNote" style="margin-top:14px">リンクの中にデータが入っている（サーバーには送られない）。</div>
    <div class="note" style="margin-top:10px"><b>リンクが長くて届かないときは「ファイルで送る」。</b>中身を丸ごとファイルにして、LINE・AirDrop・メールで送れる（サムネもそのまま入る）。受け取った端末では、ファイルを保存してから、画面いちばん下の「読み込む」で選ぶ。</div>
    <div class="f" style="margin-top:18px"><label>受け取る側はこっち：届いたリンクを貼る</label><textarea id="rcv" placeholder="https://shiochann.github.io/tools/#h=…（メッセージごと貼っても大丈夫）" style="min-height:72px;font-size:13px"></textarea></div>
    <div class="row"><span class="spacer"></span><button class="btn" id="rcvBtn">貼ったリンクを読み込む</button></div>`);
  v.querySelector('#cancel').onclick=close;
  v.querySelector('#rcvBtn').onclick=()=>{ const t=v.querySelector('#rcv').value.trim(); const h=extractHash(t); if(!h){ toast(t?'引き継ぎリンクが見つからなかった、、、':'引き継ぎリンクを貼ってね'); return; } receiveHash(h); };
  v.querySelector('#fileBtn').onclick=shareFile;
  const lk=v.querySelector('#lk'), qr=v.querySelector('#qr'), sz=v.querySelector('#sz'), note=v.querySelector('#shareNote');
  let url='', seq=0;
  v.querySelector('#cp').onclick=async()=>{ if(!url) return; if(await copyText(url)) toast('コピーした！！'); else toast('コピーできなかった、、、'); };
  async function build(){
    const my=++seq, withImg=own?v.querySelector('#withImg').checked:false;
    qr.innerHTML='<div style="color:var(--sub);font-size:13px;padding:20px">作ってる、、、</div>'; lk.textContent=''; sz.textContent='';
    try{ url=location.origin+location.pathname+'#'+await encodeShare(withImg); }catch(e){ if(my===seq){ lk.textContent='リンクを作れなかった、、、'; qr.innerHTML=''; } return; }
    if(my!==seq) return;
    lk.textContent=url.slice(0,72)+'…（全部で'+url.length.toLocaleString()+'文字。「リンクをコピー」で丸ごとコピーされる）';
    const bytes=new TextEncoder().encode(url).length, kb=(bytes/1024).toFixed(bytes<10240?1:0);
    sz.textContent=`（${kb}KB）`;
    const tips=[];
    if(withImg) tips.push('サムネは小さくして入れている（長辺160px）。');
    if(bytes>LINE_MAX) tips.push(`このリンクは長いので、LINEのトークでは送れないことがある（1万字まで）。<b>メール・AirDrop・メモアプリの共有</b>で自分に送るか${own&&withImg?'、上のチェックを外してサムネ抜きにする':''}と確実。`);
    note.innerHTML='リンクの中にデータが入っている（サーバーには送られない）。'+tips.join('');
    if(bytes>QR_MAX){ qr.innerHTML=`<div style="color:var(--sub);font-size:13px;padding:14px 16px;max-width:280px">${withImg?'サムネが入っているので':'データが多くて'}QRには入らない（${kb}KB）。「リンクをコピー」して自分に送ってね${own&&withImg?'。サムネ抜きならQRが出ることが多い':''}。</div>`; return; }
    try{ await loadQR(); if(my!==seq) return; const size=Math.min(300, window.innerWidth-80); qr.innerHTML='<div></div>'; new QRCode(qr.firstChild,{text:url,width:size,height:size,correctLevel:QRCode.CorrectLevel.L}); }
    catch(e){ qr.innerHTML=`<div style="color:var(--sub);font-size:13px;padding:14px 16px">QRを作れなかった（オフライン？）。リンクをコピーして送ってね。</div>`; }
  }
  if(own) v.querySelector('#withImg').onchange=build;
  build();
}
async function receiveShare(){
  if(!/^#[hj]=/.test(location.hash)) return;
  const h=extractHash(location.hash)||location.hash; history.replaceState(null,'',location.pathname+location.search);
  receiveHash(h);
}
function receiveFailed(hash,err){
  const n=(hash||'').length, old=err==='old';
  let why='途中で切れているみたい。';
  if(old) why='このブラウザが古くて開けない（iPhoneはiOS 16.4以上、Androidは最近のChromeが必要）。';
  else if(n>=9000) why=`途中で切れているみたい（貼られたのは${n.toLocaleString()}文字）。<b>LINEのトークは1万字あたりで切れる</b>ので、長いリンクはそこで欠けることが多い。`;
  else if(n<200) why='リンクの一部しか貼られていないみたい。';
  const v=sheet(`<h2>このリンクは読めなかった</h2>
    <div class="f"><div style="color:var(--sub);font-size:13px;line-height:1.7">${why}</div></div>
    <div class="note"><b>直し方</b><br>
    ・送る側で「リンクをコピー」ボタンを使って丸ごとコピーする（文字を選んでコピーすると途中までになりやすい）<br>
    ・「自分で載せたサムネも入れる」のチェックを外して、短いリンクにする<br>
    ・いちばん確実：送る側で<b>「ファイルで送る」</b>→ LINEやAirDropでファイルを送る → この端末で保存して、画面いちばん下の<b>「読み込む」</b>で選ぶ</div>
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn primary" id="okF">わかった</button></div>`);
  v.querySelector('#okF').onclick=close;
}
// 中身を丸ごとファイルにして共有（対応端末では共有シート、それ以外はダウンロード）
async function shareFile(){
  const d=new Date(), z=n=>String(n).padStart(2,'0'); const name=`tools-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}.json`;
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  try{ const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'tools 引き継ぎ'}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast('ファイルを保存した。相手に送って「読み込む」で開いてね');
}
async function receiveHash(hash){
  let d=null, err='';
  try{ d=await decodeShare(hash); }catch(e){ d=null; err=String(e&&e.message||e); }
  if(!d){ receiveFailed(hash,err); return; }
  const n=`ツール${d.tools.length}・プロンプト${d.prompts.length}（箱${(d.boxes||[]).length}）・コンテンツ${(d.contents||[]).length}（ジャンル${(d.cboxes||[]).length}）`;
  const v=sheet(`<h2>引き継ぎデータを受け取る</h2>
    <div class="f"><div style="color:var(--sub);font-size:13px">${n} が入っている。今この端末にあるものに<b>足す</b>か、この端末のものを消して<b>置き換える</b>か選んでね。</div></div>
    <div class="row"><button class="btn" id="no">やめる</button><span class="spacer"></span><button class="btn danger" id="rp">置き換える</button><button class="btn primary" id="ad">足す</button></div>`);
  v.querySelector('#no').onclick=close;
  v.querySelector('#ad').onclick=()=>{ close(); applyImport(d,true); };
  v.querySelector('#rp').onclick=()=>{ if(confirm('この端末にあるものを全部消して置き換える？')){ close(); applyImport(d,false); } };
}

/* ---------- events ---------- */
document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); });
$('#q').oninput=e=>{ q=e.target.value.trim(); render(); };
$('#fab').onclick=()=>tab==='tools'?toolForm():tab==='prompts'?promptForm():contentForm();
$('#gear').onclick=settingsSheet;
$('#sortBtn').onclick=()=>{ sorting=!sorting; render(); if(!sorting) toast('並び順を保存した！！'); };
$('#bannerClose').onclick=()=>{ S.banner=false; save(); render(); };
$('#exportBtn').onclick=exportJSON;
$('#linkBtn').onclick=shareSheet;
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; };
document.addEventListener('click',async e=>{
  const mb=e.target.closest('[data-mv-box]'); if(mb){ e.stopPropagation(); move(S.boxes,mb.dataset.mvBox,+mb.dataset.dir); return; }
  const mc=e.target.closest('[data-mv-cbox]'); if(mc){ e.stopPropagation(); move(S.cboxes,mc.dataset.mvCbox,+mc.dataset.dir); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.mvTool){ move(S.tools,b.dataset.mvTool,+b.dataset.dir); return; }
  if(b.dataset.mvPrompt){ move(S.prompts,b.dataset.mvPrompt,+b.dataset.dir); return; }
  if(b.dataset.mvContent){ move(S.contents,b.dataset.mvContent,+b.dataset.dir); return; }
  if(b.dataset.moreContent){ const c=S.contents.find(x=>x.id===b.dataset.moreContent); const items=[]; if(c.url){ items.push({label:'開く',fn:()=>window.open(c.url,'_blank','noopener')},{label:'URLをコピー',fn:async()=>{ await copyText(c.url); toast('コピーした！！'); }}); } items.push({label:'直す',fn:()=>contentForm(c)},{label:'削除',danger:true,fn:()=>{ if(confirm('このコンテンツを消す？')){ S.contents=S.contents.filter(x=>x.id!==c.id); save(); render(); } }}); menu(items); }
  if(b.dataset.read){ const d=document.querySelector(`.ctext[data-cbody="${b.dataset.read}"]`); d.hidden=!d.hidden; b.textContent=d.hidden?'読む':'閉じる'; }
  if(b.dataset.ccopy){ const c=S.contents.find(x=>x.id===b.dataset.ccopy); if(await copyText(c.body)) toast('コピーした！！'); else toast('コピーできなかった、、、'); }
  if(b.dataset.cbox){ if(b.dataset.cbox==='__new') boxForm(null,'c'); else { cbox=b.dataset.cbox; render(); } }
  if(b.dataset.moreTool){ e.preventDefault(); const t=S.tools.find(x=>x.id===b.dataset.moreTool); menu([{label:'開く',fn:()=>window.open(t.url,'_blank','noopener')},{label:'URLをコピー',fn:async()=>{ await copyText(t.url); toast('コピーした！！'); }},{label:'直す',fn:()=>toolForm(t)},{label:'削除',danger:true,fn:()=>{ if(confirm('このツールを消す？')){ S.tools=S.tools.filter(x=>x.id!==t.id); save(); render(); } }}]); }
  if(b.dataset.morePrompt){ const p=S.prompts.find(x=>x.id===b.dataset.morePrompt); menu([{label:'直す',fn:()=>promptForm(p)},{label:'削除',danger:true,fn:()=>{ if(confirm('このプロンプトを消す？')){ S.prompts=S.prompts.filter(x=>x.id!==p.id); save(); render(); } }}]); }
  if(b.dataset.copy){ const p=S.prompts.find(x=>x.id===b.dataset.copy); const ok=await copyText(p.body); if(ok){ b.classList.add('done'); b.lastChild.textContent='コピーした'; toast('コピーした！！'); setTimeout(()=>{ b.classList.remove('done'); b.lastChild.textContent='コピー'; },1400); } else toast('コピーできなかった、、、'); }
  if(b.dataset.peek){ const pre=document.querySelector(`pre[data-body="${b.dataset.peek}"]`); pre.hidden=!pre.hidden; b.textContent=pre.hidden?'中身':'閉じる'; }
  if(b.dataset.box){ if(b.dataset.box==='__new') boxForm(); else { box=b.dataset.box; render(); } }
});
// 箱・ジャンルのチップは右クリック／長押しで名前変更
function bindChipEdit(sel,attr,list,kind){
  const el=$(sel); let lp;
  const pick=e=>{ const c=e.target.closest('.chip'); const id=c&&c.dataset[attr]; return id&&!['all','__new'].includes(id)?list().find(b=>b.id===id):null; };
  el.addEventListener('contextmenu',e=>{ const b=pick(e); if(b){ e.preventDefault(); boxForm(b,kind); } });
  el.addEventListener('touchstart',e=>{ const b=pick(e); if(b) lp=setTimeout(()=>boxForm(b,kind),550); },{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(lp),{passive:true}));
}
bindChipEdit('#chips','box',()=>S.boxes,'p');
bindChipEdit('#cchips','cbox',()=>S.cboxes,'c');
render();
receiveShare();
